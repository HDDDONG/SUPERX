<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SUPERX · 弹窗优化</title>
  <style>
    html { filter: grayscale(1); }
    :root {
      --ink: #182235;
      --muted: #737d8e;
      --line: #dce2ea;
      --paper: #eef1f5;
      --card: #fff;
      --dark: #242a31;
      --soft: #f6f7f9;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      overflow-x: hidden;
      padding: 24px;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    button { font: inherit; }
    .page-head { max-width: 1080px; margin: 0 auto 20px; }
    .page-head h1 { margin: 0; font-size: 24px; }
    .page-head p { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .compare-grid {
      width: min(100%, 1080px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      margin: 0 auto;
    }
    .example {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
    .example-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }
    .example-title { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
    .example-index {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: #fff;
      background: var(--dark);
      font-size: 11px;
      font-weight: 800;
    }
    .example-head h2 { margin: 0; font-size: 15px; }
    .example-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .reset-button {
      min-width: 72px;
      height: 32px;
      flex: 0 0 auto;
      border: 1px solid #cfd6df;
      border-radius: 8px;
      color: #414a58;
      background: #fff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .reset-button:active { background: var(--soft); }
    .phone-area {
      display: grid;
      place-items: center;
      min-height: 760px;
      padding: 20px;
      background: linear-gradient(180deg, #f8f9fb, #edf0f4);
    }
    .phone {
      width: min(100%, 344px);
      height: 720px;
      overflow: hidden;
      border: 8px solid #171c22;
      border-radius: 38px;
      background: #111;
      box-shadow: 0 18px 42px rgba(32, 39, 49, .16);
    }
    .phone iframe { width: 100%; height: 100%; display: block; border: 0; background: #111; }
    .mapping {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      border-top: 1px solid var(--line);
      background: var(--line);
    }
    .mapping div { min-height: 58px; padding: 10px 12px; background: var(--card); }
    .mapping span { display: block; color: var(--muted); font-size: 9px; }
    .mapping b { display: block; margin-top: 4px; font-size: 11px; line-height: 1.4; }
    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 24px;
      max-width: calc(100vw - 32px);
      padding: 10px 15px;
      border-radius: 9px;
      color: #fff;
      background: rgba(28, 33, 39, .94);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: .18s ease;
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 860px) {
      body { padding: 16px; }
      .compare-grid { grid-template-columns: 1fr; }
      .phone-area { min-height: 744px; padding: 12px; }
      .phone { height: 720px; }
    }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>弹窗优化</h1>
    <p>活动弹窗与公告弹窗统一在弹窗卡片下方提供“今日不再提醒”。关闭按钮只关闭当前一次，该按钮用于记录当前业务弹窗的当日抑制状态。</p>
  </header>

  <main class="compare-grid">
    <section class="example" aria-labelledby="activityExampleTitle">
      <header class="example-head">
        <div class="example-title">
          <span class="example-index">01</span>
          <div><h2 id="activityExampleTitle">活动弹窗示例</h2><p>阶梯充值规则形式弹窗</p></div>
        </div>
        <button class="reset-button" type="button" data-reset-frame="activityPopupFrame">重置示例</button>
      </header>
      <div class="phone-area">
        <div class="phone">
          <iframe id="activityPopupFrame" title="活动弹窗真机示例" src="activity-center-tier-recharge.html?flow=1&stage=popup"></iframe>
        </div>
      </div>
      <div class="mapping">
        <div><span>内容来源</span><b>活动前台展示与规则配置</b></div>
        <div><span>主按钮来源</span><b>弹窗按钮文案与跳转目标</b></div>
        <div><span>关闭</span><b>仅关闭当前一次</b></div>
        <div><span>今日不再提醒</span><b>当前活动的前台本地状态</b></div>
      </div>
    </section>

    <section class="example" aria-labelledby="announcementExampleTitle">
      <header class="example-head">
        <div class="example-title">
          <span class="example-index">02</span>
          <div><h2 id="announcementExampleTitle">公告弹窗示例</h2><p>公告内容与行动按钮弹窗</p></div>
        </div>
        <button class="reset-button" type="button" data-reset-frame="announcementPopupFrame">重置示例</button>
      </header>
      <div class="phone-area">
        <div class="phone">
          <iframe id="announcementPopupFrame" title="公告弹窗真机示例" src="user-reach-config.html?embed=1&flow=1&module=frontendAnnouncement&stage=announcement-modal"></iframe>
        </div>
      </div>
      <div class="mapping">
        <div><span>内容来源</span><b>公告标题、内容与图片</b></div>
        <div><span>主按钮来源</span><b>公告按钮文案与跳转目标</b></div>
        <div><span>关闭</span><b>仅关闭当前一次</b></div>
        <div><span>今日不再提醒</span><b>当前公告的前台本地状态</b></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const toast = document.getElementById("toast");
    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("is-visible");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1600);
    }
    document.querySelectorAll("[data-reset-frame]").forEach((button) => {
      button.addEventListener("click", () => {
        const frame = document.getElementById(button.dataset.resetFrame);
        if (!frame) return;
        frame.src = frame.src;
        showToast("示例已重置");
      });
    });
  </script>
</body>
</html>
