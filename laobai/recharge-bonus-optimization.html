<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>充值活动加bonus优化</title>
  <style>
    :root{--bg:#f3f5f8;--paper:#fff;--ink:#202938;--muted:#758095;--line:#d9e0ea;--head:#f6f8fb;--primary:#357df4;--danger:#ef6674}
    *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}.page{width:100%;padding:20px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.page-head h1{margin:0;font-size:18px}.page-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.save{height:34px;padding:0 18px;border:0;border-radius:6px;color:#fff;background:var(--primary);font-weight:700}.card{margin-bottom:14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}.card-title{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}.card-title b{font-size:14px}.card-title span{color:var(--muted);font-size:11px}.settings{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding:14px 16px}.field label{display:block;margin-bottom:7px;font-weight:650}.radios{display:flex;gap:18px;height:34px;align-items:center}.radios label{display:flex;align-items:center;gap:6px;margin:0;font-weight:500}.cap-control{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}.switch{position:relative;width:38px;height:22px;padding:0;border:0;border-radius:11px;background:#ccd4df}.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:var(--primary)}.switch.on::after{left:19px}.input{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:5px;color:var(--ink);background:#f8fafc}.input:disabled{color:#a2aaba;background:#eef1f5}.table-wrap{padding:0 16px 16px}.rule-table{width:100%;border-collapse:collapse;table-layout:fixed}.rule-table th,.rule-table td{height:42px;padding:6px 10px;border:1px solid var(--line);text-align:left}.rule-table th{background:var(--head);color:#5c6779;font-size:12px}.rule-table th:last-child,.rule-table td:last-child{width:64px;text-align:center}.rule-table input{width:100%;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:#f8fafc}.value-input{display:grid;grid-template-columns:minmax(0,1fr) 42px}.value-input input{border-radius:5px 0 0 5px}.value-input span{display:grid;place-items:center;border:1px solid var(--line);border-left:0;border-radius:0 5px 5px 0;color:var(--muted);background:#f1f4f8}.circle{width:26px;height:26px;padding:0;border:1px solid #cbd5e2;border-radius:50%;color:#526075;background:#fff}.circle.add{color:var(--primary)}.circle.remove{color:var(--danger)}.foot-note{padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);background:#fafbfc;font-size:11px}.toast{position:fixed;right:22px;bottom:22px;padding:10px 16px;border-radius:7px;color:#fff;background:#303846;box-shadow:0 8px 24px rgba(0,0,0,.18)}.toast[hidden]{display:none}@media(max-width:720px){.page{padding:12px}.settings{grid-template-columns:1fr}.card-title span{display:none}}
  </style>
</head>
<body>
<main class="page">
  <header class="page-head"><div><h1>充值活动加bonus优化</h1><p>在现有充值活动内分别配置礼金奖励与Bonus奖励，两套结构一致、数据独立。</p></div><button class="save" id="saveButton" type="button">保存配置</button></header>
  <section class="card reward-card" data-reward="礼金">
    <div class="card-title"><b>礼金奖励设置</b><span>现有奖励设置更名</span></div>
    <div class="settings"><div class="field"><label>奖励形式</label><div class="radios"><label><input type="radio" name="giftMode" value="比例" checked>按比例</label><label><input type="radio" name="giftMode" value="固定值">固定值</label></div></div><div class="field"><label>赠送上限</label><div class="cap-control"><button class="switch" type="button" aria-pressed="false"></button><input class="input cap-input" placeholder="请输入" disabled></div></div></div>
    <div class="table-wrap"><table class="rule-table"><thead><tr><th>充值金额达到</th><th class="reward-head">赠送礼金比例</th><th><button class="circle add" type="button" aria-label="新增礼金奖励规则">+</button></th></tr></thead><tbody><tr><td><input type="number" value="100"></td><td><div class="value-input"><input type="number" value="10"><span>%</span></div></td><td><button class="circle remove" type="button">−</button></td></tr></tbody></table></div>
    <div class="foot-note">礼金奖励按现有充值活动规则生成，不与Bonus奖励合并计算。</div>
  </section>
  <section class="card reward-card" data-reward="Bonus">
    <div class="card-title"><b>Bonus奖励设置</b><span>新增，结构与礼金奖励一致</span></div>
    <div class="settings"><div class="field"><label>奖励形式</label><div class="radios"><label><input type="radio" name="bonusMode" value="比例" checked>按比例</label><label><input type="radio" name="bonusMode" value="固定值">固定值</label></div></div><div class="field"><label>赠送上限</label><div class="cap-control"><button class="switch" type="button" aria-pressed="false"></button><input class="input cap-input" placeholder="请输入" disabled></div></div></div>
    <div class="table-wrap"><table class="rule-table"><thead><tr><th>充值金额达到</th><th class="reward-head">Bonus赠送比例</th><th><button class="circle add" type="button" aria-label="新增Bonus奖励规则">+</button></th></tr></thead><tbody><tr><td><input type="number" value="100"></td><td><div class="value-input"><input type="number" value="10"><span>%</span></div></td><td><button class="circle remove" type="button">−</button></td></tr></tbody></table></div>
    <div class="foot-note">充值成功后分别生成礼金奖励记录与Bonus奖励记录，前端按两类余额分别展示。</div>
  </section>
</main>
<div class="toast" id="toast" hidden>配置已保存</div>
<script>
  document.querySelectorAll('.reward-card').forEach(card=>{
    const rewardName=card.dataset.reward;
    const syncMode=()=>{const mode=card.querySelector('input[type="radio"]:checked').value;const prefix=rewardName==='礼金'?'赠送礼金':'Bonus赠送';card.querySelector('.reward-head').textContent=`${prefix}${mode==='比例'?'比例':'固定值'}`;card.querySelectorAll('.value-input span').forEach(unit=>{unit.textContent=mode==='比例'?'%':'金额'})};
    card.querySelectorAll('input[type="radio"]').forEach(radio=>radio.addEventListener('change',syncMode));
    card.querySelector('.switch').addEventListener('click',event=>{const on=!event.currentTarget.classList.contains('on');event.currentTarget.classList.toggle('on',on);event.currentTarget.setAttribute('aria-pressed',String(on));card.querySelector('.cap-input').disabled=!on});
    card.querySelector('.add').addEventListener('click',()=>{const tbody=card.querySelector('tbody');const row=tbody.rows[0].cloneNode(true);row.querySelectorAll('input').forEach(input=>input.value='');tbody.appendChild(row);syncMode()});
    card.addEventListener('click',event=>{if(!event.target.closest('.remove'))return;const tbody=card.querySelector('tbody');if(tbody.rows.length>1)event.target.closest('tr').remove()});
    syncMode();
  });
  document.getElementById('saveButton').addEventListener('click',()=>{const toast=document.getElementById('toast');toast.hidden=false;setTimeout(()=>{toast.hidden=true},1400)});
</script>
</body>
</html>
