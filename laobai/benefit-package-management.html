<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>权益包管理</title>
  <style>
    :root{--bg:#f3f5f8;--paper:#fff;--ink:#202938;--muted:#748095;--line:#d9e1eb;--fill:#f7f9fc;--primary:#347cf5;--danger:#db4c5b;--success:#22a06b}
    *{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}.page{width:100%;padding:16px}.tabs{display:flex;height:42px;margin-bottom:12px;border-bottom:1px solid var(--line);background:var(--paper)}.tab{min-width:112px;padding:0 18px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer}.tab.active{border-bottom-color:var(--primary);color:var(--primary);font-weight:700}.card{border:1px solid var(--line);border-radius:8px;background:var(--paper)}.card+.card{margin-top:12px}.filters{display:grid;grid-template-columns:repeat(4,220px) auto;gap:14px;align-items:end;padding:16px}.field{min-width:0}.field label{display:block;margin-bottom:7px;font-weight:650}.required::before{content:"*";margin-right:5px;color:#cc3447}.control,select{width:100%;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:6px;background:var(--fill);color:var(--ink)}.actions{display:flex;gap:8px}.primary,.secondary{height:36px;padding:0 16px;border-radius:6px;font-weight:650;cursor:pointer}.primary{border:0;background:var(--primary);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.list-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px}.list-title{font-weight:700}.count{margin-left:7px;color:var(--muted);font-weight:500}.table-wrap{width:100%;padding:0 16px 16px;overflow:hidden}.data-table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid var(--line)}.data-table th,.data-table td{height:48px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.data-table th{height:42px;background:#f2f5f9;font-size:12px}.data-table th:last-child,.data-table td:last-child{border-right:0}.data-table tbody tr:last-child td{border-bottom:0}.status{display:inline-flex;height:24px;padding:0 9px;align-items:center;border-radius:12px;font-size:12px;font-weight:700}.status.on,.status.success{background:#e5f6ee;color:var(--success)}.status.off{background:#edf0f4;color:#7a8494}.status.pending{background:#fff4d6;color:#9a6700}.status.failed{background:#fdecef;color:#c8354d}.link{padding:0;border:0;background:none;color:var(--primary);cursor:pointer}.link+.link{margin-left:10px}.link.danger{color:var(--danger)}.panel[hidden]{display:none}.empty{height:150px!important;text-align:center!important;color:var(--muted)}.mask{position:fixed;z-index:20;inset:0;background:rgba(25,34,47,.48)}.mask[hidden]{display:none}.drawer{position:fixed;z-index:21;top:0;right:0;width:min(780px,94vw);height:100vh;background:#fff;box-shadow:-12px 0 32px rgba(25,37,55,.18);transform:translateX(100%);transition:.2s}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;height:58px;padding:0 20px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.drawer-head h2{margin:0;font-size:16px}.close{width:30px;height:30px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer}.drawer-body{height:calc(100vh - 122px);padding:18px 20px;overflow-y:auto}.section{border:1px solid var(--line);border-radius:8px}.section+.section{margin-top:14px}.section-title{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700}.section-body{padding:14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}.span-2{grid-column:1/-1}.unit-input{display:grid;grid-template-columns:minmax(0,1fr) 50px}.unit-input .control{border-radius:6px 0 0 6px}.unit{display:grid;place-items:center;border:1px solid var(--line);border-left:0;border-radius:0 6px 6px 0;background:#eef2f7;color:var(--muted);font-weight:650}.switch-line{display:flex;align-items:center;gap:10px}.switch{position:relative;width:38px;height:22px;padding:0;border:0;border-radius:11px;background:#cbd4e0;cursor:pointer}.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.switch.on{background:var(--primary)}.switch.on::after{left:19px}.benefit-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.circle{display:inline-grid;width:28px;height:28px;padding:0;place-items:center;border:1px solid var(--line);border-radius:50%;background:#fff;color:#536075;font-size:17px;cursor:pointer}.benefit-table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid var(--line)}.benefit-table th,.benefit-table td{height:48px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.benefit-table th{height:40px;background:#f2f5f9;text-align:left;font-size:12px}.benefit-table th:last-child,.benefit-table td:last-child{border-right:0;text-align:center}.benefit-table tr:last-child td{border-bottom:0}.benefit-table select,.benefit-table input{height:34px}.rule-tip{display:block;overflow:hidden;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}.notice{display:flex;gap:10px;margin-top:12px;padding:11px 13px;border:1px solid #8ab4f8;border-left:4px solid var(--primary);border-radius:7px;background:#edf5ff;color:#244e85}.notice b{white-space:nowrap}.drawer-foot{display:flex;height:64px;padding:0 20px;align-items:center;justify-content:flex-end;gap:10px;border-top:1px solid var(--line)}.toast{position:fixed;z-index:30;right:22px;bottom:22px;padding:10px 16px;border-radius:7px;background:#303846;color:#fff}.toast[hidden]{display:none}[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 2px rgba(219,76,91,.12)}
    @media(max-width:1100px){.filters{grid-template-columns:repeat(2,1fr)}.data-table th,.data-table td{padding:5px;font-size:11px}}@media(max-width:680px){.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}}
  </style>
</head>
<body>
  <main class="page">
    <nav class="tabs"><button class="tab active" data-tab="packagePanel" type="button">权益包列表</button><button class="tab" data-tab="orderPanel" type="button">权益包订单</button></nav>
    <section class="panel" id="packagePanel">
      <section class="card"><div class="filters"><div class="field"><label>权益包ID</label><input class="control" id="packageIdFilter" placeholder="请输入"></div><div class="field"><label>权益包名称</label><input class="control" id="packageNameFilter" placeholder="请输入"></div><div class="field"><label>包ID</label><select id="appFilter"><option value="">全部</option><option>IN01</option><option>IN02</option><option>US01</option></select></div><div class="field"><label>状态</label><select id="statusFilter"><option value="">全部</option><option value="enabled">已启用</option><option value="disabled">已停用</option></select></div><div class="actions"><button class="primary" id="searchPackages" type="button">查询</button><button class="secondary" id="resetPackages" type="button">重置</button></div></div></section>
      <section class="card"><div class="list-head"><div class="list-title">权益包列表 <span class="count" id="packageCount"></span></div><button class="primary" id="addPackage" type="button">新增权益包</button></div><div class="table-wrap"><table class="data-table"><colgroup><col style="width:12%"><col style="width:14%"><col style="width:10%"><col style="width:8%"><col style="width:23%"><col style="width:8%"><col style="width:13%"><col style="width:6%"><col style="width:6%"></colgroup><thead><tr><th>权益包ID</th><th>权益包名称</th><th>包ID</th><th>售价</th><th>权益内容</th><th>单人限购</th><th>售卖时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="packageRows"></tbody></table></div></section>
    </section>
    <section class="panel" id="orderPanel" hidden>
      <section class="card"><div class="filters"><div class="field"><label>订单号</label><input class="control" id="orderIdFilter" placeholder="请输入"></div><div class="field"><label>会员ID</label><input class="control" id="memberFilter" placeholder="请输入"></div><div class="field"><label>支付状态</label><select id="paymentFilter"><option value="">全部</option><option>成功</option><option>处理中</option><option>失败</option></select></div><div class="field"><label>发放状态</label><select id="deliveryFilter"><option value="">全部</option><option>全部完成</option><option>部分完成</option><option>发放失败</option></select></div><div class="actions"><button class="primary" id="searchOrders" type="button">查询</button><button class="secondary" id="resetOrders" type="button">重置</button></div></div></section>
      <section class="card"><div class="list-head"><div class="list-title">权益包订单 <span class="count" id="orderCount"></span></div></div><div class="table-wrap"><table class="data-table"><colgroup><col style="width:14%"><col style="width:13%"><col style="width:10%"><col style="width:8%"><col style="width:8%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:6%"><col style="width:4%"></colgroup><thead><tr><th>订单号</th><th>权益包名称</th><th>会员ID</th><th>包ID</th><th>支付金额</th><th>支付状态</th><th>Cash发放</th><th>礼金发放</th><th>Bonus发放</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="orderRows"></tbody></table></div></section>
    </section>
  </main>
  <div class="mask" id="mask" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-head"><h2 id="drawerTitle">新增权益包</h2><button class="close" id="closeDrawer" type="button">×</button></div><div class="drawer-body">
    <section class="section"><div class="section-title">基本信息</div><div class="section-body"><div class="form-grid"><div class="field"><label class="required">权益包名称</label><input class="control" id="editName" value="新人三重权益包"></div><div class="field"><label class="required">包ID</label><select id="editApp"><option>IN01</option><option>IN02</option><option>US01</option></select></div><div class="field"><label class="required">售卖开始时间</label><input class="control" id="editStart" type="datetime-local" value="2026-08-01T00:00"></div><div class="field"><label class="required">售卖结束时间</label><input class="control" id="editEnd" type="datetime-local" value="2099-01-01T23:59"></div><div class="field"><label class="required">前台标题</label><input class="control" id="editFrontTitle" value="₹100 三重权益包"></div><div class="field"><label>前台宣传文案</label><input class="control" id="editSlogan" value="Cash、礼金、Bonus 一次获得"></div></div></div></section>
    <section class="section"><div class="section-title">购买与用户限制</div><div class="section-body"><div class="form-grid"><div class="field"><label class="required">权益包售价</label><div class="unit-input"><input class="control" id="editPrice" type="number" min="0.01" step="0.01" value="100"><span class="unit">INR</span></div></div><div class="field"><label class="required">每人限购次数</label><div class="unit-input"><input class="control" id="editLimit" type="number" min="1" step="1" value="1"><span class="unit">次</span></div></div><div class="field"><label>限购重置周期</label><select id="editReset"><option>不重置</option><option>每日</option><option>每周</option><option>每月</option></select></div><div class="field"><label>用户条件</label><div class="switch-line"><button class="switch" id="conditionSwitch" type="button" aria-pressed="false"></button><span id="conditionText">全部用户</span></div></div></div></div></section>
    <section class="section"><div class="section-title">权益内容</div><div class="section-body"><div class="benefit-head"><span>至少配置一项，同一种权益只能添加一次</span><button class="circle" id="addBenefit" type="button" aria-label="新增权益">+</button></div><table class="benefit-table"><colgroup><col style="width:18%"><col style="width:18%"><col style="width:24%"><col style="width:32%"><col style="width:8%"></colgroup><thead><tr><th>权益类型</th><th>权益金额</th><th>发放方式</th><th>规则配置</th><th>操作</th></tr></thead><tbody id="benefitRows"></tbody></table><div class="notice"><b>发放说明</b><span>Cash、礼金和 Bonus 分别生成发放记录；Bonus 进入存钱罐并读取该包当前启用的存钱罐配置。</span></div></div></section>
  </div><div class="drawer-foot"><button class="secondary" id="cancelDrawer" type="button">取消</button><button class="primary" id="savePackage" type="button">确认</button></div></aside>
  <div class="toast" id="toast" hidden></div>
  <script>
    const packages=[{id:"PACK-202608-001",name:"新人三重权益包",app:"IN01",price:100,benefits:[{type:"Cash",amount:100,delivery:"直接到账"},{type:"礼金",amount:100,delivery:"需要领取"},{type:"Bonus",amount:100,delivery:"进入存钱罐"}],limit:1,start:"2026-08-01",end:"2099-01-01",status:"enabled"},{id:"PACK-202608-002",name:"周末加码权益包",app:"IN02",price:300,benefits:[{type:"Cash",amount:300,delivery:"直接到账"},{type:"Bonus",amount:150,delivery:"进入存钱罐"}],limit:1,start:"2026-08-01",end:"2026-09-30",status:"disabled"}];
    const orders=[{id:"BPO-20260806-001",name:"新人三重权益包",member:"8xgaekg",app:"IN01",amount:100,payment:"成功",cash:"已到账",gift:"待领取",bonus:"已入存钱罐",created:"2026-08-06 10:20"},{id:"BPO-20260806-002",name:"新人三重权益包",member:"7gk4mhh",app:"IN01",amount:100,payment:"处理中",cash:"待发放",gift:"待发放",bonus:"待生成",created:"2026-08-06 10:28"},{id:"BPO-20260806-003",name:"周末加码权益包",member:"62nwtfj",app:"IN02",amount:300,payment:"失败",cash:"未发放",gift:"—",bonus:"未生成",created:"2026-08-06 10:31"}];
    let editingId=null;const packageRows=document.getElementById("packageRows"),orderRows=document.getElementById("orderRows"),benefitRows=document.getElementById("benefitRows"),drawer=document.getElementById("drawer"),mask=document.getElementById("mask"),toast=document.getElementById("toast");
    const form={name:document.getElementById("editName"),app:document.getElementById("editApp"),price:document.getElementById("editPrice"),limit:document.getElementById("editLimit"),start:document.getElementById("editStart"),end:document.getElementById("editEnd")};
    function money(value){return `₹${Number(value).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}`}
    function showToast(message){toast.textContent=message;toast.hidden=false;setTimeout(()=>toast.hidden=true,1400)}
    function benefitSummary(list){return list.map(item=>`${item.type} ${money(item.amount)}`).join("＋")}
    function filteredPackages(){const id=document.getElementById("packageIdFilter").value.trim().toLowerCase(),name=document.getElementById("packageNameFilter").value.trim().toLowerCase(),app=document.getElementById("appFilter").value,status=document.getElementById("statusFilter").value;return packages.filter(item=>(!id||item.id.toLowerCase().includes(id))&&(!name||item.name.toLowerCase().includes(name))&&(!app||item.app===app)&&(!status||item.status===status))}
    function renderPackages(){const list=filteredPackages();document.getElementById("packageCount").textContent=`共 ${list.length} 条`;packageRows.innerHTML=list.length?list.map(item=>`<tr><td title="${item.id}">${item.id}</td><td title="${item.name}">${item.name}</td><td>${item.app}</td><td>${money(item.price)}</td><td title="${benefitSummary(item.benefits)}">${benefitSummary(item.benefits)}</td><td>${item.limit} 次</td><td>${item.start}—${item.end}</td><td><span class="status ${item.status==="enabled"?"on":"off"}">${item.status==="enabled"?"已启用":"已停用"}</span></td><td><button class="link" data-edit="${item.id}">编辑</button><button class="link ${item.status==="enabled"?"danger":""}" data-toggle="${item.id}">${item.status==="enabled"?"停用":"启用"}</button></td></tr>`).join(""):'<tr><td class="empty" colspan="9">暂无符合条件的权益包</td></tr>'}
    function filteredOrders(){const id=document.getElementById("orderIdFilter").value.trim().toLowerCase(),member=document.getElementById("memberFilter").value.trim().toLowerCase(),payment=document.getElementById("paymentFilter").value,delivery=document.getElementById("deliveryFilter").value;return orders.filter(item=>(!id||item.id.toLowerCase().includes(id))&&(!member||item.member.toLowerCase().includes(member))&&(!payment||item.payment===payment)&&(!delivery||delivery==="全部完成"&&item.cash==="已到账"&&item.bonus==="已入存钱罐"||delivery==="部分完成"&&item.payment==="成功"&&item.gift!=="已领取"||delivery==="发放失败"&&item.payment==="失败"))}
    function paymentClass(value){return value==="成功"?"success":value==="失败"?"failed":"pending"}
    function renderOrders(){const list=filteredOrders();document.getElementById("orderCount").textContent=`共 ${list.length} 条`;orderRows.innerHTML=list.length?list.map(item=>`<tr><td title="${item.id}">${item.id}</td><td>${item.name}</td><td>${item.member}</td><td>${item.app}</td><td>${money(item.amount)}</td><td><span class="status ${paymentClass(item.payment)}">${item.payment}</span></td><td>${item.cash}</td><td>${item.gift}</td><td>${item.bonus}</td><td>${item.created}</td><td><button class="link" type="button" title="仅保留详情入口">详情</button></td></tr>`).join(""):'<tr><td class="empty" colspan="11">暂无符合条件的订单</td></tr>'}
    function benefitRule(type){return type==="Cash"?"Cash打码倍率 1倍":type==="礼金"?"适用范围：无限制；打码 1倍":"读取所在包存钱罐配置"}
    function addBenefitRow(data={type:"Cash",amount:100,delivery:"直接到账"}){const row=document.createElement("tr");row.innerHTML=`<td><select class="benefit-type"><option${data.type==="Cash"?" selected":""}>Cash</option><option${data.type==="礼金"?" selected":""}>礼金</option><option${data.type==="Bonus"?" selected":""}>Bonus</option></select></td><td><div class="unit-input"><input class="control benefit-amount" type="number" min="0.01" step="0.01" value="${data.amount}"><span class="unit">INR</span></div></td><td><select class="benefit-delivery"></select></td><td><span class="rule-tip"></span></td><td><button class="circle remove-benefit" type="button">−</button></td>`;const type=row.querySelector(".benefit-type"),delivery=row.querySelector(".benefit-delivery"),tip=row.querySelector(".rule-tip");function sync(){const options=type.value==="Cash"?["直接到账"]:type.value==="礼金"?["直接发放","需要领取"]:["进入存钱罐"];delivery.innerHTML=options.map(value=>`<option${value===data.delivery?" selected":""}>${value}</option>`).join("");tip.textContent=benefitRule(type.value)}type.addEventListener("change",()=>{data.delivery="";sync()});row.querySelector(".remove-benefit").addEventListener("click",()=>{if(benefitRows.children.length===1){alert("至少保留一项权益");return}row.remove()});sync();benefitRows.appendChild(row)}
    function openDrawer(item){editingId=item?.id??null;document.getElementById("drawerTitle").textContent=item?"编辑权益包":"新增权益包";form.name.value=item?.name??"新人三重权益包";form.app.value=item?.app??"IN01";form.price.value=item?.price??100;form.limit.value=item?.limit??1;form.start.value=`${item?.start??"2026-08-01"}T00:00`;form.end.value=`${item?.end??"2099-01-01"}T23:59`;benefitRows.innerHTML="";(item?.benefits??[{type:"Cash",amount:100,delivery:"直接到账"},{type:"礼金",amount:100,delivery:"需要领取"},{type:"Bonus",amount:100,delivery:"进入存钱罐"}]).forEach(addBenefitRow);mask.hidden=false;requestAnimationFrame(()=>drawer.classList.add("open"));drawer.setAttribute("aria-hidden","false")}
    function closeDrawer(){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");setTimeout(()=>mask.hidden=true,200)}
    function readBenefits(){return [...benefitRows.querySelectorAll("tr")].map(row=>({type:row.querySelector(".benefit-type").value,amount:Number(row.querySelector(".benefit-amount").value),delivery:row.querySelector(".benefit-delivery").value}))}
    document.querySelectorAll(".tab").forEach(tab=>tab.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(item=>item.classList.toggle("active",item===tab));document.querySelectorAll(".panel").forEach(panel=>panel.hidden=panel.id!==tab.dataset.tab)}));
    document.getElementById("searchPackages").addEventListener("click",renderPackages);document.getElementById("resetPackages").addEventListener("click",()=>{["packageIdFilter","packageNameFilter","appFilter","statusFilter"].forEach(id=>document.getElementById(id).value="");renderPackages()});document.getElementById("searchOrders").addEventListener("click",renderOrders);document.getElementById("resetOrders").addEventListener("click",()=>{["orderIdFilter","memberFilter","paymentFilter","deliveryFilter"].forEach(id=>document.getElementById(id).value="");renderOrders()});
    document.getElementById("addPackage").addEventListener("click",()=>openDrawer());document.getElementById("addBenefit").addEventListener("click",()=>{const used=new Set([...benefitRows.querySelectorAll(".benefit-type")].map(item=>item.value)),type=["Cash","礼金","Bonus"].find(value=>!used.has(value));if(!type){alert("Cash、礼金和 Bonus 均已配置");return}addBenefitRow({type,amount:100,delivery:type==="Bonus"?"进入存钱罐":type==="礼金"?"需要领取":"直接到账"})});
    packageRows.addEventListener("click",event=>{const edit=event.target.closest("[data-edit]"),toggle=event.target.closest("[data-toggle]");if(edit){openDrawer(packages.find(item=>item.id===edit.dataset.edit));return}if(toggle){const item=packages.find(value=>value.id===toggle.dataset.toggle);item.status=item.status==="enabled"?"disabled":"enabled";renderPackages();showToast(item.status==="enabled"?"权益包已启用":"权益包已停用")}});
    document.getElementById("conditionSwitch").addEventListener("click",event=>{const on=event.currentTarget.getAttribute("aria-pressed")!=="true";event.currentTarget.setAttribute("aria-pressed",String(on));event.currentTarget.classList.toggle("on",on);document.getElementById("conditionText").textContent=on?"已开启用户条件":"全部用户"});
    document.getElementById("savePackage").addEventListener("click",()=>{const benefits=readBenefits(),types=benefits.map(item=>item.type);let invalid=null,message="";if(!form.name.value.trim()){invalid=form.name;message="请输入权益包名称"}else if(Number(form.price.value)<=0){invalid=form.price;message="权益包售价必须大于0"}else if(Number(form.limit.value)<1){invalid=form.limit;message="每人限购次数至少为1"}else if(!benefits.length){message="请至少配置一项权益"}else if(new Set(types).size!==types.length){message="同一种权益只能配置一次"}else if(benefits.some(item=>!item.amount||item.amount<=0)){message="权益金额必须大于0"}if(message){if(invalid){invalid.setAttribute("aria-invalid","true");invalid.focus()}alert(message);return}const values={name:form.name.value.trim(),app:form.app.value,price:Number(form.price.value),benefits,limit:Number(form.limit.value),start:form.start.value.slice(0,10),end:form.end.value.slice(0,10)};if(editingId){Object.assign(packages.find(item=>item.id===editingId),values)}else{packages.unshift({id:`PACK-${Date.now().toString().slice(-9)}`,...values,status:"disabled"})}closeDrawer();renderPackages();showToast(editingId?"权益包已更新":"权益包已新增，默认停用")});
    document.getElementById("closeDrawer").addEventListener("click",closeDrawer);document.getElementById("cancelDrawer").addEventListener("click",closeDrawer);mask.addEventListener("click",closeDrawer);renderPackages();renderOrders();
  </script>
</body>
</html>
